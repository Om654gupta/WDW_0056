<!DOCTYPE html>
 <html>
    <head>
        <title>Student Registration Form</title>
    </head>
    <body>
        <h2 aling="center">Student Registration Form</h2>
        <hr>
        <form>
            <p>
                <label>Full Name:</label>
                <input type="text"name="fullname"placeholder="Enter you full name"required>

            </p>
            <p>
                <label>Email:</label>
                <input type="email"name="email"placeholder="Enter vaild email address"required>

            </p>
            <p>
                <label>Gender:</label>
                <input type="radio"name="gender"value="Male">Male
                <input type="radio" name="gender"value="Female">Female
                <input type="radio"name="gender"value="other">other
            </p>
            <p>
                <label>Contact No:</label>
                <input type="tel"name="contact" placeholder="Enter phone number"required>
            </p>
            <p>
                <label>Address:</label><br>
                <textarea name="address" rows="4"cols="40" placeholder="Enter your address"></textarea>

            </p>
            <p>
                <input type="submit"value="Register">
                <input type="reset"value="Clear">
            </p>
        </form>
        <hr>
        <p aling="center">&copy; 2025 Student Registration Portal</p>
    </body>
 </html>
